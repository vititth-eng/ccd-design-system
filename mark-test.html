<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCD Mark — sandbox</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body{font:14px/1.5 system-ui;margin:0;padding:32px;background:var(--paper);color:var(--ink);}
  h1{font-size:1rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 12px;}
  .row{display:flex;gap:24px;align-items:flex-end;padding:16px 0;border-bottom:1px solid var(--rule);}
  .row.dark{background:var(--brand-deep);padding:24px;border-radius:8px;border:none;color:#fff;}
  .row.dark h1{color:#B5C7EB;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .cell small{font-size:11px;color:var(--ink-muted);}
  .row.dark .cell small{color:#B5C7EB;}
  .mark{
    display:inline-block;
    background-color: currentColor;
    -webkit-mask: url('assets/ccd-mark-full.svg') center/contain no-repeat;
    mask: url('assets/ccd-mark-full.svg') center/contain no-repeat;
    aspect-ratio: 195/178;
    color: var(--brand-deep);
  }
  .mark--wire{
    -webkit-mask-image: url('assets/ccd-mark-wireframe.svg');
    mask-image: url('assets/ccd-mark-wireframe.svg');
  }
  .row.dark .mark{ color:#fff; }
  .nav-demo{display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);}
  .nav-demo span.lbl{font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .nav-demo.dark{background:var(--brand-deep);border-color:transparent;color:#fff;}
  .nav-demo.dark span.lbl{color:#fff;}
  .nav-demo.dark .mark{ color:#fff; }
</style>
</head>
<body>
  <h1>FULL (silhouette) · on paper · color: brand-deep</h1>
  <div class="row">
    <span class="cell"><span class="mark" style="height:20px"></span><small>20</small></span>
    <span class="cell"><span class="mark" style="height:26px"></span><small>26</small></span>
    <span class="cell"><span class="mark" style="height:32px"></span><small>32</small></span>
    <span class="cell"><span class="mark" style="height:48px"></span><small>48</small></span>
    <span class="cell"><span class="mark" style="height:96px"></span><small>96</small></span>
  </div>

  <h1 style="margin-top:32px">WIREFRAME · on paper · color: brand-deep</h1>
  <div class="row">
    <span class="cell"><span class="mark mark--wire" style="height:20px"></span><small>20</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:26px"></span><small>26</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:32px"></span><small>32</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:48px"></span><small>48</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:96px"></span><small>96</small></span>
  </div>

  <h1 style="margin-top:32px">SAME FILES · color: white · on navy</h1>
  <div class="row dark">
    <span class="cell"><span class="mark" style="height:26px"></span><small>full 26</small></span>
    <span class="cell"><span class="mark" style="height:48px"></span><small>full 48</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:26px"></span><small>wire 26</small></span>
    <span class="cell"><span class="mark mark--wire" style="height:48px"></span><small>wire 48</small></span>
  </div>

  <h1 style="margin-top:32px">IN-NAV CONTEXT (mark + label)</h1>
  <div class="row" style="gap:16px;flex-wrap:wrap">
    <span class="nav-demo"><span class="mark" style="height:26px"></span><span class="lbl">Onboarding</span></span>
    <span class="nav-demo"><span class="mark mark--wire" style="height:26px"></span><span class="lbl">Onboarding</span></span>
    <span class="nav-demo dark"><span class="mark" style="height:26px"></span><span class="lbl">Onboarding</span></span>
    <span class="nav-demo dark"><span class="mark mark--wire" style="height:26px"></span><span class="lbl">Onboarding</span></span>
  </div>
</body>
</html>
