<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Decide 12 · Danger red</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<link rel="stylesheet" href="./buttons.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); padding: var(--s-6) var(--s-7); }
  h1 { margin: 0 0 var(--s-1); }
  .sub { margin: 0 0 var(--s-6); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s-5); max-width: 900px; }
  .cand { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4); border: 1px solid var(--rule); border-radius: var(--r-base); }
  .cand__row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .hex { font-variant-numeric: tabular-nums; }
  .aa { font-size: var(--fs-body); font-variant-numeric: tabular-nums; }
  .aa.pass { color: var(--ink); }
  .aa.fail { color: var(--muted); }
  .aa b { font-weight: var(--fw-semi); }
  .tag { font-size: var(--fs-caption); color: var(--muted); }
  .note { margin-top: var(--s-6); font-size: var(--fs-body); color: var(--muted); max-width: 560px; }
</style>
</head>
<body>
  <h1 class="t-title">Danger red — pick a fill</h1>
  <p class="t-sub sub">All shown as the real danger button (white text). AA needs ≥ 4.5:1. Bright <code>--neg</code> shown last = why we need a darker fill.</p>

  <div class="grid" id="grid"></div>

  <p class="note">Lower = deeper/oxblood, calmer. Higher = brighter/hotter, more alarm. Any that passes AA is safe; pick by tone. Current default is C · #C4372C.</p>

<script>
  var cands = [
    { id:'A', hex:'#A8271C', tag:'deep oxblood' },
    { id:'B', hex:'#B92D22', tag:'brick' },
    { id:'C', hex:'#C4372C', tag:'current default' },
    { id:'D', hex:'#CF3A2C', tag:'bright signal' },
    { id:'E', hex:'#BE2F3A', tag:'crimson (cooler)' },
    { id:'neg', hex:'#FF5F56', tag:'--neg · DOT ONLY' }
  ];
  function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function lum(rgb){var a=rgb.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2];}
  function ratio(fg,bg){var L1=lum(fg),L2=lum(bg),hi=Math.max(L1,L2),lo=Math.min(L1,L2);return (hi+.05)/(lo+.05);}
  var g = document.getElementById('grid');
  cands.forEach(function(c){
    var r = ratio([255,255,255], hx(c.hex));
    var pass = r >= 4.5;
    var el = document.createElement('div');
    el.className = 'cand';
    el.innerHTML =
      '<button class="btn btn--danger" style="background:'+c.hex+'">ลบรายการ</button>'+
      '<div class="cand__row">'+
        '<span class="t-strong hex">'+c.id+' · '+c.hex+'</span>'+
        '<span class="aa '+(pass?'pass':'fail')+'"><b>'+r.toFixed(2)+':1</b> '+(pass?'✓':'✗')+'</span>'+
      '</div>'+
      '<span class="tag">'+c.tag+'</span>';
    g.appendChild(el);
  });
</script>
</body>
</html>
