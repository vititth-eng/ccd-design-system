<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v2 sandbox — chip fill softness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--paper-tint); font-family: var(--sans); color: var(--ink); padding: var(--s-5); }
  .stage { max-width: 1080px; margin-inline: auto; background: var(--card); border-radius: var(--r-lg); padding: var(--s-5); }
  .head { margin: 0 0 var(--s-4); padding-bottom: var(--s-2); border-bottom: 1px solid var(--rule); }
  .note { color: var(--ink-muted); }
  .grid { display: grid; grid-template-columns: 70px repeat(3, 1fr); gap: var(--s-5) var(--s-4); align-items: center; }
  .colhead { font-size: var(--fs-data); font-weight: var(--fw-semi); }
  .colhead .sub { display: block; color: var(--ink-muted); font-weight: var(--fw-regular); font-size: var(--fs-micro); }
  .rowlabel { font-size: var(--fs-data); font-weight: var(--fw-semi); }
  .cell { display: flex; gap: var(--s-3); align-items: center; }

  /* base chip geometry — rect (v2) */
  .c { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--r-card); font-size: var(--fs-data); font-weight: var(--fw-semi); white-space: nowrap; }

  /* A — MINE: 12% fill + hard 1px full-color edge + dot + ink text */
  .cA { background: color-mix(in srgb, var(--c) 12%, white); border: 1px solid var(--c); color: var(--ink); }
  .cA::before { content:""; width:7px; height:7px; border-radius:50%; background: var(--c); }

  /* B — REFERENCE: ~10% fill, NO edge, deep-colored text + arrow, no dot */
  .cB { background: color-mix(in srgb, var(--c) 10%, white); border: 1px solid transparent; color: color-mix(in srgb, var(--c), #14213A 30%); }

  /* C — COMPROMISE: ~10% fill + faint same-hue edge + deep-colored text */
  .cC { background: color-mix(in srgb, var(--c) 10%, white); border: 1px solid color-mix(in srgb, var(--c) 30%, white); color: color-mix(in srgb, var(--c), #14213A 30%); }
</style>
</head>
<body>
<div class="stage">
  <div class="head"><span class="t-section">Chip fill softness — what makes the reference soft <span class="note">(soft trio: green #4FA869 · red #D9604F)</span></span></div>

  <div class="grid">
    <div></div>
    <div class="colhead">A · mine<span class="sub">12% fill · hard edge · dot · ink text</span></div>
    <div class="colhead">B · reference<span class="sub">10% fill · no edge · colored text + arrow</span></div>
    <div class="colhead">C · compromise<span class="sub">10% fill · faint edge · colored text</span></div>

    <div class="rowlabel">Green</div>
    <div class="cell" style="--c:#4FA869"><span class="c cA">↗ 67%</span></div>
    <div class="cell" style="--c:#4FA869"><span class="c cB">↗ 67%</span></div>
    <div class="cell" style="--c:#4FA869"><span class="c cC">↗ 67%</span></div>

    <div class="rowlabel">Red</div>
    <div class="cell" style="--c:#D9604F"><span class="c cA">↘ 12%</span></div>
    <div class="cell" style="--c:#D9604F"><span class="c cB">↘ 12%</span></div>
    <div class="cell" style="--c:#D9604F"><span class="c cC">↘ 12%</span></div>
  </div>
</div>
</body>
</html>
