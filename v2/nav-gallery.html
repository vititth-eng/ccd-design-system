<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nav · v2 component</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<link rel="stylesheet" href="./nav.css" />
<link rel="stylesheet" href="./buttons.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); }
  .frame { min-height: 420px; }
  .content { padding: var(--s-6) var(--s-7); }
  .lbl { margin: 0 0 var(--s-3); }
  .lbl span { color: var(--muted); font-weight: var(--fw-regular); }
  .tabpanel { margin-top: var(--s-5); color: var(--muted); font-size: var(--fs-body); }
  .icon-btn { width:32px;height:32px; display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--muted);border-radius:var(--r-base);cursor:pointer; }
  .icon-btn:hover { background:var(--divider); color:var(--ink); }
</style>
</head>
<body>
  <!-- TOP NAV -->
  <nav class="topnav">
    <a class="topnav__brand" href="#"><span class="topnav__mark"></span>CCD</a>
    <div class="topnav__links">
      <a class="topnav__link topnav__link--active" href="#">แดชบอร์ด</a>
      <a class="topnav__link" href="#">การประเมิน</a>
      <a class="topnav__link" href="#">พนักงาน</a>
      <a class="topnav__link" href="#">รายงาน</a>
    </div>
    <span class="topnav__spacer"></span>
    <div class="topnav__actions">
      <button class="icon-btn" aria-label="แจ้งเตือน">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a4 4 0 0 0-4 4c0 4-2 5-2 5h12s-2-1-2-5a4 4 0 0 0-4-4zM8.5 16a1.7 1.7 0 0 0 3 0"/></svg>
      </button>
      <span class="avatar">วต</span>
    </div>
  </nav>

  <div class="frame content">
    <!-- TABS -->
    <p class="t-section lbl">Tabs <span>— in-page section switcher, accent underline = active</span></p>
    <div class="tabs" id="tabs">
      <button class="tab tab--active" data-panel="p1">ภาพรวม</button>
      <button class="tab" data-panel="p2">รายบุคคล</button>
      <button class="tab" data-panel="p3">แผนก</button>
      <button class="tab" data-panel="p4">ประวัติ</button>
    </div>
    <div class="tabpanel" id="panel">แสดงเนื้อหาแท็บ “ภาพรวม”</div>
  </div>

<script>
  var labels = { p1:'ภาพรวม', p2:'รายบุคคล', p3:'แผนก', p4:'ประวัติ' };
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('tab--active'); });
    b.classList.add('tab--active');
    document.getElementById('panel').textContent = 'แสดงเนื้อหาแท็บ “' + labels[b.dataset.panel] + '”';
  });
</script>
</body>
</html>
