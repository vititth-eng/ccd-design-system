<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v2 sandbox — table character</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<style>
  /* scratch sandbox — codify the winner into tables.css, then delete this */
  html, body { margin: 0; }
  body { background: var(--paper-tint); font-family: var(--sans); color: var(--ink); padding: var(--s-5); }
  .stage { max-width: 1080px; margin-inline: auto; background: var(--card); border-radius: var(--r-lg); padding: var(--s-5); }
  .opt { margin-bottom: var(--s-6); }
  .opt:last-child { margin-bottom: 0; }
  .opt__head { margin: 0 0 var(--s-3); padding-bottom: var(--s-2); border-bottom: 1px solid var(--rule); }
  .opt__head .tag2 { color: var(--brand); font-weight: var(--fw-bold); }

  /* shared base — quiet chrome, 14-gray header, baseline numeric */
  .dt { width: 100%; border-collapse: collapse; }
  .dt th, .dt td { padding: var(--s-2) var(--s-3); text-align: left; vertical-align: middle; }
  .dt th.n, .dt td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .dt thead th { color: var(--ink-muted); font-weight: var(--fw-regular); font-size: var(--fs-data); border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .dt tbody tr { cursor: pointer; }
  .drill { width: 1%; text-align: right; color: var(--ink-muted); font-size: 18px; line-height: 1; }
  .dt tbody tr:hover .drill { color: var(--brand); }

  /* A — flush + hairline rule per row */
  .A .dt tbody tr { border-bottom: 1px solid var(--rule); }
  .A .dt tbody tr:last-child { border-bottom: 0; }
  .A .dt tbody tr:hover { background: var(--paper-tint); }

  /* B — flush + zebra (no per-row rule) */
  .B .dt tbody tr:nth-child(even) { background: var(--paper-tint); }
  .B .dt tbody tr:hover { background: var(--heat-1); }

  /* C — wrapped card (re-skinned old .tbl: bordered box, WHITE header, rect, NO side-stripe) */
  .C .wrap { border: 1px solid var(--rule); border-radius: var(--r-card); overflow: hidden; }
  .C .dt thead th { background: var(--card); }
  .C .dt th, .C .dt td { padding-left: var(--s-4); padding-right: var(--s-4); }
  .C .dt tbody tr { border-bottom: 1px solid var(--rule); }
  .C .dt tbody tr:last-child { border-bottom: 0; }
  .C .dt tbody tr:hover { background: var(--paper-tint); }

  /* status tag — rect (v2 rectilinear), tinted + dot. 14 per parked-12 (candidate for on-call 12 if chunky) */
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: var(--r-card); font-size: var(--fs-data); font-weight: var(--fw-regular); color: var(--ink); white-space: nowrap; }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); }
  .tag.pos { background: var(--tint-positive); } .tag.pos::before { background: var(--dot-positive); }
  .tag.cau { background: var(--tint-caution); } .tag.cau::before { background: var(--dot-caution); }
  .tag.alt { background: var(--tint-alert); }   .tag.alt::before { background: var(--dot-negative); }
  .tag.neu { background: var(--tint-neutral); }
</style>
</head>
<body>
<div class="stage">

  <section class="opt A">
    <div class="opt__head"><span class="t-section"><span class="tag2">A</span> · flush + เส้นคั่นแถว (hairline) — เหมือนตารางในหน้า reference</span></div>
    <table class="dt"><thead><tr><th>Wave</th><th>สถานะ</th><th class="n">ผู้ถูกประเมิน</th><th class="n">คืบหน้า</th><th>ช่วงเวลา</th><th></th></tr></thead><tbody id="tA"></tbody></table>
  </section>

  <section class="opt B">
    <div class="opt__head"><span class="t-section"><span class="tag2">B</span> · flush + แถบสลับสี (zebra) — ไม่มีเส้นคั่น</span></div>
    <table class="dt"><thead><tr><th>Wave</th><th>สถานะ</th><th class="n">ผู้ถูกประเมิน</th><th class="n">คืบหน้า</th><th>ช่วงเวลา</th><th></th></tr></thead><tbody id="tB"></tbody></table>
  </section>

  <section class="opt C">
    <div class="opt__head"><span class="t-section"><span class="tag2">C</span> · กล่องมีกรอบ (wrapped card) — แถบหัวตารางอ่อน · old .tbl re-skinned</span></div>
    <div class="wrap"><table class="dt"><thead><tr><th>Wave</th><th>สถานะ</th><th class="n">ผู้ถูกประเมิน</th><th class="n">คืบหน้า</th><th>ช่วงเวลา</th><th></th></tr></thead><tbody id="tC"></tbody></table></div>
  </section>

</div>
<script>
  const rows = [
    { wave: 'รอบประเมิน Q3/2026',   st: ['pos', 'กำลังดำเนิน'], n: 12, prog: 76,  span: '1–31 ก.ค.' },
    { wave: 'ผู้บริหารระดับต้น 2026', st: ['cau', 'รอเริ่ม'],     n: 8,  prog: 0,   span: 'เริ่ม 1 ส.ค.' },
    { wave: 'ทีมขาย ภาคเหนือ',       st: ['neu', 'เสร็จสิ้น'],    n: 18, prog: 100, span: 'เสร็จ 30 มิ.ย.' },
    { wave: 'นำร่อง HR',             st: ['alt', 'หมดอายุ'],      n: 5,  prog: 40,  span: 'หมดอายุ 15 มิ.ย.' },
  ];
  const rowHTML = r => `<tr>
    <td><span class="t-strong">${r.wave}</span></td>
    <td><span class="tag ${r.st[0]}">${r.st[1]}</span></td>
    <td class="n t-body">${r.n}</td>
    <td class="n t-body">${r.prog}%</td>
    <td class="t-sub">${r.span}</td>
    <td class="drill">›</td>
  </tr>`;
  ['tA', 'tB', 'tC'].forEach(id => { document.getElementById(id).innerHTML = rows.map(rowHTML).join(''); });
</script>
</body>
</html>
