<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v2 sandbox — color tone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--paper-tint); font-family: var(--sans); color: var(--ink); padding: var(--s-5); }
  .stage { max-width: 1080px; margin-inline: auto; background: var(--card); border-radius: var(--r-lg); padding: var(--s-5); }
  .head { margin: 0 0 var(--s-4); padding-bottom: var(--s-2); border-bottom: 1px solid var(--rule); }
  .note { color: var(--ink-muted); }

  .grid { display: grid; grid-template-columns: 90px repeat(3, 1fr); gap: var(--s-4); align-items: start; }
  .colhead { font-size: var(--fs-data); font-weight: var(--fw-semi); }
  .colhead .hex { color: var(--ink-muted); font-weight: var(--fw-regular); font-size: var(--fs-micro); }
  .rowlabel { font-size: var(--fs-data); font-weight: var(--fw-semi); align-self: center; }

  /* chart proxy — area fade under a line, like the reference card */
  .chart { height: 64px; border-radius: var(--r-card); border: 1px solid var(--rule); overflow: hidden; position: relative; }
  .chart::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); }
  .chart::before { content: ""; position: absolute; left: 0; right: 0; top: 26px; height: 3px; background: var(--c); }

  .marks { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: var(--r-card);
          border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, white);
          font-size: var(--fs-data); font-weight: var(--fw-semi); color: var(--c); white-space: nowrap; }
</style>
</head>
<body>
<div class="stage">
  <div class="head"><span class="t-section">Color tone — misty vs saturated vs soft <span class="note">(judge each at chart scale, 8px dot, and chip)</span></span></div>

  <div class="grid">
    <div></div>
    <div class="colhead">Misty <span class="hex">(original)</span></div>
    <div class="colhead">Saturated <span class="hex">(my pick)</span></div>
    <div class="colhead">Soft <span class="hex">(reference-like)</span></div>

    <!-- GREEN -->
    <div class="rowlabel">Green</div>
    <div style="--c:#6B8C2C"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↗ 67%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#6B8C2C</span></div></div>
    <div style="--c:#1F9E4D"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↗ 67%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#1F9E4D</span></div></div>
    <div style="--c:#4FA869"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↗ 67%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#4FA869</span></div></div>

    <!-- RED -->
    <div class="rowlabel">Red</div>
    <div style="--c:#C84A3A"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↘ 12%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#C84A3A</span></div></div>
    <div style="--c:#D63A2E"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↘ 12%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#D63A2E</span></div></div>
    <div style="--c:#D9604F"><div class="chart"></div><div class="marks"><span class="dot"></span><span class="chip">↘ 12%</span><span class="hex" style="color:var(--ink-muted);font-size:var(--fs-micro)">#D9604F</span></div></div>
  </div>
</div>
</body>
</html>
