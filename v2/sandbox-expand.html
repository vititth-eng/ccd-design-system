<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v2 — expandable row (aligned child rows)</title>
<base href="http://localhost:4180/v2/" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<link rel="stylesheet" href="./status.css" />
<link rel="stylesheet" href="./tables.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--paper-tint); font-family: var(--sans); color: var(--ink); padding: var(--s-5); }
  .stage { max-width: 820px; margin-inline: auto; background: var(--card); border-radius: var(--r-lg); padding: var(--s-5); }
  .head { margin: 0 0 var(--s-4); }
  .note { color: var(--ink-muted); }

  /* ── PROPOSED · FLUSH table (no card box) + expand-in-place aligned child rows ─
     Owner: the box border is wasted space/visual. Drop the card edge; keep only
     full-width lines BETWEEN rows + a closing line UNDER the last row. Table is
     flush to the container (first/last cells lose their outer padding). Child
     rows live in the SAME table so columns align; open parent casts a shadow. */

  /* flush: kill the card edge, align table to the container, last row keeps a line */
  .data-table-wrap { border: 0; border-radius: 0; }
  .data-table th:first-child:not(.data-table__drill),
  .data-table td:first-child:not(.data-table__drill) { padding-left: 0; }   /* flat tables: flush-left, aligns with heading */
  .data-table .data-table__drill { padding-left: var(--s-2); padding-right: 0; }   /* drill: left clearance for the chevron; no right pad — the next column's left padding makes the gap */
  /* last column keeps its right padding so numbers don't kiss the edge */
  /* 2px rules bookend the table — on the TABLE element so the bottom line shows
     when COLLAPSED too (a tr:last-child rule lands on a hidden child row) */
  .data-table { border-top: 2px solid var(--rule); border-bottom: 2px solid var(--rule); }

  /* expand-in-place */
  .data-table tbody tr.is-drill { user-select: none; }
  /* CSS-drawn chevron — rotates cleanly around its true center. A text glyph (›)
     has uneven metrics, so it visibly shifts when it flips to ⌄. */
  .data-table__drill { font-size: 0; }   /* drop any text glyph in the cell */
  .data-table tbody td.data-table__drill::before {   /* body cells only — not the empty header th */
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transform-origin: center;   /* points right › */
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .data-table tbody tr.is-open .data-table__drill { color: var(--brand); }
  .data-table tbody tr.is-open .data-table__drill::before { transform: rotate(45deg); }   /* points down ⌄ */
  .data-table tbody tr.is-open > td { position: relative; z-index: 1; box-shadow: 0 6px 9px -3px rgba(20, 37, 73, 0.22); }
  .data-table tbody tr.data-table__child .child-label { padding-left: var(--s-6); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div class="t-title">กระแสเงินสดรายปี</div>
    <div class="t-sub">คลิกแถวเพื่อกางรายไตรมาส <span class="note">· child rows อยู่ในตารางเดียวกัน คอลัมน์ตรงกัน</span></div>
  </div>

  <div class="data-table-wrap">
    <table class="data-table data-table--matrix">
      <thead><tr>
        <th class="data-table__drill"></th>
        <th>ปี</th>
        <th class="n">รายได้</th>
        <th class="n">ต้นทุน</th>
        <th class="n">กระแสเงินสด</th>
        <th class="n">สะสม</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
  const data = [
    { y: '2028', rev: 165, cost: 112, net: 53, cum: 75,  q: [['ไตรมาส 1',40,28,12],['ไตรมาส 2',41,28,13],['ไตรมาส 3',42,28,14],['ไตรมาส 4',42,28,14]] },
    { y: '2029', rev: 198, cost: 124, net: 74, cum: 149, q: [['ไตรมาส 1',47,31,16],['ไตรมาส 2',49,31,18],['ไตรมาส 3',50,31,19],['ไตรมาส 4',52,31,21]] },
    { y: '2030', rev: 214, cost: 131, net: 83, cum: 232, q: [['ไตรมาส 1',51,32,19],['ไตรมาส 2',53,33,20],['ไตรมาส 3',54,33,21],['ไตรมาส 4',56,33,23]] },
  ];
  document.getElementById('tb').innerHTML = data.map(d => `
    <tr class="is-drill" data-year="${d.y}">
      <td class="data-table__drill"></td>
      <td>${d.y}</td><td class="n">${d.rev}</td><td class="n">${d.cost}</td><td class="t-strong n">${d.net}</td><td class="n">${d.cum}</td>
    </tr>
    ${d.q.map(q => `<tr class="data-table__child" data-parent="${d.y}" hidden>
      <td></td><td class="child-label">${q[0]}</td><td class="n">${q[1]}</td><td class="n">${q[2]}</td><td class="n">${q[3]}</td><td class="n"></td>
    </tr>`).join('')}
  `).join('');

  document.querySelectorAll('#tb tr.is-drill').forEach(r => {
    r.addEventListener('click', () => {
      const open = r.classList.toggle('is-open');
      document.querySelectorAll(`#tb tr.data-table__child[data-parent="${r.dataset.year}"]`).forEach(c => c.hidden = !open);
    });
  });
</script>
</body>
</html>
