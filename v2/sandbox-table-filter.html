<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v2 — header sort + type-aware filter</title>
<base href="http://localhost:4180/v2/" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./type.css" />
<link rel="stylesheet" href="./status.css" />
<link rel="stylesheet" href="./forms.css" />
<link rel="stylesheet" href="./tables.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--paper-tint); font-family: var(--sans); color: var(--ink); padding: var(--s-5); }
  .stage { max-width: 820px; margin-inline: auto; background: var(--card); border-radius: var(--r-lg); padding: var(--s-5); }
  .head { margin: 0 0 var(--s-4); }
  .note { color: var(--ink-muted); }
  .empty { padding: var(--s-5); text-align: center; color: var(--ink-muted); }

  /* ── PROPOSED · header sort + filter (codify into tables.css if approved) ──
     Click a header → popover: sort asc/desc + a filter control whose shape
     follows the column's data-type (text·enum·number·date). One target, one
     pattern. Active sort shows a caret; active filter shows a brand dot. */

  /* clickable header — the whole label is the trigger */
  .data-table thead th.th-sortable { padding: 0; position: relative; }   /* trigger owns padding; relative = popover anchor */
  .th-trigger {
    display: inline-flex; align-items: center; gap: 6px; width: 100%;
    padding: var(--s-2) var(--s-4); border: 0; background: transparent;
    font: inherit; color: var(--ink-muted); cursor: pointer; text-align: inherit;
    white-space: nowrap; user-select: none;
  }
  .data-table thead th.n .th-trigger { justify-content: flex-end; }   /* numeric headers right-align */
  .th-trigger:hover { color: var(--ink); background: var(--paper-tint); }
  .th-sortable.is-active .th-trigger { color: var(--ink); }
  .th-trigger:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring-color); outline-offset: calc(-1 * var(--focus-ring-width)); }

  /* sort caret — CSS-drawn triangle, points up (asc) / down (desc) */
  .th-caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .th-sortable:not(.is-asc):not(.is-desc) .th-caret { display: none; }
  .th-sortable.is-asc  .th-caret { border-bottom: 5px solid currentColor; }
  .th-sortable.is-desc .th-caret { border-top: 5px solid currentColor; }
  /* filter-active dot */
  .th-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
  .th-sortable:not(.is-filtered) .th-dot { display: none; }

  /* the popover — same surface language as the kebab menu */
  .th-menu {
    position: absolute; left: var(--s-2); top: calc(100% - 2px); z-index: var(--z-dropdown);
    min-width: 200px; text-align: left; white-space: normal;
    background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-card);
    box-shadow: var(--shadow-3); padding: var(--s-2);
  }
  .data-table thead th:last-child .th-menu { left: auto; right: var(--s-2); }   /* last col opens leftward, stays on-page */
  .th-menu__sort {
    display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); font-weight: var(--fw-regular);
    padding: var(--s-2) var(--s-3); border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer;
  }
  .th-menu__sort:hover { background: var(--paper-tint); }
  .th-menu__sort.is-on { color: var(--brand); font-weight: var(--fw-semi); }
  .th-menu__div { height: 1px; background: var(--rule); margin: var(--s-2) 0; }
  .th-menu__filter { padding: 0 var(--s-1); }
  .th-menu__range { display: flex; align-items: center; gap: var(--s-2); }
  .th-menu__range .f-control { padding: var(--s-1) var(--s-2); }
  .th-menu__checks { display: flex; flex-direction: column; gap: var(--s-2); max-height: 180px; overflow: auto; }
  .th-menu__clear {
    display: block; width: 100%; text-align: center; font: inherit; font-size: var(--fs-small);
    color: var(--ink-muted); padding: var(--s-2); margin-top: var(--s-2);
    border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer;
  }
  .th-menu__clear:hover { background: var(--paper-tint); color: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div class="t-title">รอบการประเมิน</div>
    <div class="t-sub">คลิกหัวคอลัมน์เพื่อเรียง/กรอง <span class="note">· ตัวกรองปรับตามชนิดข้อมูล</span></div>
  </div>

  <div class="data-table-wrap">
    <table class="data-table">
      <thead><tr id="thr"></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
  // column model — type drives both sort and the filter control
  const cols = [
    { key: 'name',   label: 'ชื่อรอบ',       type: 'text' },
    { key: 'status', label: 'สถานะ',         type: 'enum' },
    { key: 'count',  label: 'ผู้ถูกประเมิน',  type: 'number', num: true },
    { key: 'start',  label: 'เริ่ม',          type: 'date',   num: true },
  ];
  const rows = [
    { name: 'รอบประเมิน Q3/2026',   status: 'กำลังดำเนิน', count: 12, start: '2026-07-01', tone: 'status--positive' },
    { name: 'ผู้บริหารระดับต้น 2026', status: 'รอเริ่ม',     count: 8,  start: '2026-08-15', tone: 'status--caution' },
    { name: 'ทีมขาย ภาคเหนือ',       status: 'เสร็จสิ้น',    count: 18, start: '2026-04-10', tone: '' },
    { name: 'นำร่อง HR',             status: 'หมดอายุ',     count: 5,  start: '2026-02-01', tone: 'status--alert' },
    { name: 'รอบประเมินกลางปี',      status: 'กำลังดำเนิน', count: 24, start: '2026-06-20', tone: 'status--positive' },
  ];

  const fmtDate = iso => new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const cell = (c, r) => c.key === 'status'
    ? `<span class="status ${r.tone}">${r.status}</span>`
    : c.key === 'start' ? fmtDate(r.start) : r[c.key];

  // state
  let sortKey = null, sortDir = null;       // 'asc' | 'desc'
  const filters = {};                       // key -> {text} | {set:Set} | {min,max} | {from,to}

  const sortLabels = {
    text:   ['ก → ฮ', 'ฮ → ก'],   enum: ['ก → ฮ', 'ฮ → ก'],
    number: ['น้อย → มาก', 'มาก → น้อย'], date: ['เก่า → ใหม่', 'ใหม่ → เก่า'],
  };

  // ── header build ──────────────────────────────────────────
  document.getElementById('thr').innerHTML = cols.map(c => `
    <th class="th-sortable ${c.num ? 'n' : ''}" data-key="${c.key}" data-type="${c.type}">
      <button class="th-trigger" type="button">
        <span class="th-dot"></span><span>${c.label}</span><span class="th-caret"></span>
      </button>
      <div class="th-menu" hidden>
        <button class="th-menu__sort" data-dir="asc">${sortLabels[c.type][0]}</button>
        <button class="th-menu__sort" data-dir="desc">${sortLabels[c.type][1]}</button>
        <div class="th-menu__div"></div>
        <div class="th-menu__filter">${filterControl(c)}</div>
        <button class="th-menu__clear">ล้างตัวกรองคอลัมน์นี้</button>
      </div>
    </th>`).join('');

  function filterControl(c) {
    if (c.type === 'text')
      return `<input class="f-control th-f" data-key="${c.key}" type="text" placeholder="ค้นหา…">`;
    if (c.type === 'enum') {
      const vals = [...new Set(rows.map(r => r[c.key]))];
      return `<div class="th-menu__checks">${vals.map(v =>
        `<label class="f-choice"><input type="checkbox" class="th-f" data-key="${c.key}" value="${v}"><span>${v}</span></label>`).join('')}</div>`;
    }
    if (c.type === 'number')
      return `<div class="th-menu__range">
        <input class="f-control th-f n" data-key="${c.key}" data-bound="min" type="number" inputmode="numeric" placeholder="ต่ำสุด">
        <span class="note">–</span>
        <input class="f-control th-f n" data-key="${c.key}" data-bound="max" type="number" inputmode="numeric" placeholder="สูงสุด"></div>`;
    return `<div class="th-menu__range">
        <input class="f-control th-f" data-key="${c.key}" data-bound="from" type="date">
        <span class="note">–</span>
        <input class="f-control th-f" data-key="${c.key}" data-bound="to" type="date"></div>`;
  }

  // ── render = filter → sort → paint ────────────────────────
  function render() {
    let view = rows.filter(r => cols.every(c => pass(c, r)));
    if (sortKey) {
      const c = cols.find(x => x.key === sortKey), dir = sortDir === 'asc' ? 1 : -1;
      view = [...view].sort((a, b) => dir * cmp(c, a[c.key], b[c.key]));
    }
    const tb = document.getElementById('tb');
    tb.innerHTML = view.length
      ? view.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'n' : ''}">${cell(c, r)}</td>`).join('')}</tr>`).join('')
      : `<tr><td class="empty" colspan="${cols.length}">ไม่พบรายการที่ตรงกับตัวกรอง</td></tr>`;
    // header indicators
    document.querySelectorAll('.th-sortable').forEach(th => {
      const k = th.dataset.key;
      th.classList.toggle('is-asc',  sortKey === k && sortDir === 'asc');
      th.classList.toggle('is-desc', sortKey === k && sortDir === 'desc');
      th.classList.toggle('is-active', sortKey === k || isFiltered(k));
      th.classList.toggle('is-filtered', isFiltered(k));
      th.querySelectorAll('.th-menu__sort').forEach(b =>
        b.classList.toggle('is-on', sortKey === k && sortDir === b.dataset.dir));
    });
  }

  const cmp = (c, a, b) => c.type === 'number' ? a - b
    : c.type === 'date' ? new Date(a) - new Date(b) : String(a).localeCompare(String(b), 'th');

  function isFiltered(k) {
    const f = filters[k]; if (!f) return false;
    if (f.text) return true;
    if (f.set) return f.set.size > 0;
    if ('min' in f || 'max' in f) return f.min != null || f.max != null;
    if ('from' in f || 'to' in f) return !!f.from || !!f.to;
    return false;
  }
  function pass(c, r) {
    const f = filters[c.key], v = r[c.key]; if (!f) return true;
    if (c.type === 'text') return !f.text || String(v).toLowerCase().includes(f.text.toLowerCase());
    if (c.type === 'enum') return !f.set || f.set.size === 0 || f.set.has(v);
    if (c.type === 'number') return (f.min == null || v >= f.min) && (f.max == null || v <= f.max);
    return (!f.from || v >= f.from) && (!f.to || v <= f.to);   // date: ISO strings compare lexically
  }

  // ── wiring ────────────────────────────────────────────────
  document.querySelectorAll('.th-sortable').forEach(th => {
    const key = th.dataset.key;
    th.querySelector('.th-trigger').addEventListener('click', e => {
      e.stopPropagation();
      const menu = th.querySelector('.th-menu'), open = !menu.hidden;
      document.querySelectorAll('.th-menu').forEach(m => m.hidden = true);
      menu.hidden = open;
    });
    th.querySelectorAll('.th-menu__sort').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      sortKey = key; sortDir = b.dataset.dir; render();
    }));
    th.querySelectorAll('.th-f').forEach(inp => inp.addEventListener('input', () => {
      const c = cols.find(x => x.key === key);
      if (c.type === 'text') filters[key] = { text: inp.value };
      else if (c.type === 'enum') filters[key] = { set: new Set([...th.querySelectorAll('.th-f:checked')].map(x => x.value)) };
      else if (c.type === 'number') (filters[key] ??= { min: null, max: null })[inp.dataset.bound] = inp.value === '' ? null : +inp.value;
      else (filters[key] ??= { from: '', to: '' })[inp.dataset.bound] = inp.value;
      render();
    }));
    th.querySelector('.th-menu__clear').addEventListener('click', e => {
      e.stopPropagation();
      delete filters[key];
      th.querySelectorAll('.th-f').forEach(x => { if (x.type === 'checkbox') x.checked = false; else x.value = ''; });
      render();
    });
    th.querySelector('.th-menu').addEventListener('click', e => e.stopPropagation());
  });
  document.addEventListener('click', () => document.querySelectorAll('.th-menu').forEach(m => m.hidden = true));

  render();
</script>
</body>
</html>
